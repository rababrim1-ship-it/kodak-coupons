<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الإدارة | كودك</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body>
<header><a class="logo" href="index.html">كودك<span>.</span></a><nav><a href="index.html">الموقع</a></nav></header>
<main class="admin"><div id="login"><h1>لوحة الإدارة</h1><p>ادخلي بحساب الإدارة.</p><input id="email" type="email" placeholder="البريد الإلكتروني"><input id="password" type="password" placeholder="كلمة المرور"><button class="btn" id="loginBtn">دخول</button><p id="loginMsg"></p></div>
<div id="panel" hidden><div class="admin-head"><div><h1>لوحة التحكم 👑</h1><p id="who"></p></div><button id="logout" class="secondary">تسجيل الخروج</button></div>
<section class="card"><h2>إضافة كود</h2><div class="form"><input id="store" placeholder="المتجر: Temu"><input id="code" placeholder="كود الخصم"><input id="discount" placeholder="مثلاً خصم 30%"><input id="link" placeholder="رابط المتجر أو Affiliate URL"><input id="expires" type="date"><textarea id="description" placeholder="وصف العرض"></textarea><button class="btn" id="addBtn">إضافة الكود</button><p id="addMsg"></p></div></section>
<section class="card"><h2>الأكواد الموجودة</h2><div id="adminGrid"></div></section></div></main><script src="config.js"></script><script src="admin.js"></script></body></html>
